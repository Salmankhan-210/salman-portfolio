<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheSkills — Freelancing Live Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#1c0a2e;
    --purple:#3a1361;
    --purple-mid:#5a2291;
    --purple-bright:#7b2fc4;
    --gold:#d4a531;
    --gold-bright:#f0c94a;
    --white:#faf6ff;
    --grey:#b8a8c9;
    --good:#3ddc84;
    --bad:#ff5c6c;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(123,47,196,0.28), transparent 45%),
      radial-gradient(circle at 88% 80%, rgba(212,165,49,0.16), transparent 50%),
      var(--purple-deep);
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }
  .deco-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.3; }
  .app{ position:relative; z-index:1; width:100%; max-width:560px; }

  .crest{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px; }
  .logo-img{ width:64px; height:64px; border-radius:50%; box-shadow:0 6px 22px rgba(0,0,0,0.4); border:2px solid rgba(240,201,74,0.5); }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .crest-dot{width:5px;height:5px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 8px var(--gold-bright);}
  .crest-line{height:1px; width:34px; background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);}
  .brand{
    font-family:'Playfair Display',serif;
    font-weight:800;
    letter-spacing:0.03em;
    text-align:center;
    font-size:16px;
    color:var(--gold-bright);
    text-transform:uppercase;
  }
  .brand span{ color:var(--white); }
  .tagline{ font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--grey); margin-top:-4px; }

  .card{
    background:linear-gradient(160deg, var(--purple) 0%, var(--purple-mid) 140%);
    border:1px solid rgba(240,201,74,0.22);
    border-radius:var(--radius);
    padding:32px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:24px; right:24px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(240,201,74,0.7), transparent);
  }

  h1{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-size:26px;
    line-height:1.25;
    margin:0 0 6px;
    background:linear-gradient(180deg, #ffffff, #e6cfff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{ color:var(--grey); font-size:14px; margin:0 0 26px; }

  label{
    display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--gold-bright); margin-bottom:8px; font-weight:600;
  }
  input[type=text]{
    width:100%; padding:14px 16px; border-radius:10px;
    background:rgba(28,10,46,0.55); border:1px solid rgba(240,201,74,0.3);
    color:var(--white); font-size:16px; font-family:inherit; outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus{ border-color:var(--gold-bright); }

  .btn{
    margin-top:22px; width:100%; padding:15px; border:none; border-radius:10px;
    font-family:'Playfair Display',serif; font-weight:700; font-size:14px; letter-spacing:0.04em;
    text-transform:uppercase; cursor:pointer;
    background:linear-gradient(90deg, var(--gold), var(--gold-bright));
    color:#241002;
    box-shadow:0 8px 24px rgba(212,165,49,0.32);
    transition:transform .12s, box-shadow .12s;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 12px 28px rgba(212,165,49,0.42); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.ghost{
    background:transparent; border:1px solid rgba(240,201,74,0.4); color:var(--gold-bright);
    box-shadow:none; margin-top:12px;
  }

  .progress-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .progress-label{ font-size:12px; color:var(--grey); letter-spacing:0.05em; }
  .score-pill{
    font-family:'Playfair Display',serif; font-size:12px; font-weight:700;
    background:rgba(61,220,132,0.14); color:var(--good);
    border:1px solid rgba(61,220,132,0.35);
    padding:6px 12px; border-radius:20px;
  }
  .timer{
    font-family:'Playfair Display',serif; font-weight:700; font-size:13px;
    background:rgba(240,201,74,0.14); color:var(--gold-bright);
    border:1px solid rgba(240,201,74,0.4);
    padding:6px 12px; border-radius:20px;
  }
  .timer.warn{ background:rgba(255,92,108,0.16); color:var(--bad); border-color:rgba(255,92,108,0.45); }

  .track{ height:4px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; margin-bottom:24px; }
  .track-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); transition:width .3s; }

  .q-text{ font-size:18px; font-weight:600; line-height:1.4; margin:0 0 22px; }

  .option{
    display:flex; align-items:center; gap:12px;
    width:100%; text-align:left; padding:14px 16px; margin-bottom:10px;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12);
    border-radius:10px; color:var(--white); font-size:15px; font-family:inherit;
    cursor:pointer; transition:all .12s;
  }
  .option:hover:not(:disabled){ border-color:var(--gold-bright); background:rgba(240,201,74,0.08); }
  .option:disabled{ cursor:default; }
  .option-letter{
    width:26px; height:26px; flex:0 0 26px; border-radius:50%;
    background:rgba(240,201,74,0.14); border:1px solid rgba(240,201,74,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--gold-bright);
  }
  .option.correct{ border-color:var(--good); background:rgba(61,220,132,0.14); }
  .option.correct .option-letter{ background:var(--good); border-color:var(--good); color:#06210f; }
  .option.wrong{ border-color:var(--bad); background:rgba(255,92,108,0.14); }
  .option.wrong .option-letter{ background:var(--bad); border-color:var(--bad); color:#2a0407; }

  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.5;
    border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04);
  }
  .feedback.good{ border-color:rgba(61,220,132,0.4); }
  .feedback.bad{ border-color:rgba(255,92,108,0.4); }
  .feedback b{ display:block; margin-bottom:4px; font-family:'Playfair Display',serif; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; }
  .feedback.good b{ color:var(--good); }
  .feedback.bad b{ color:var(--bad); }

  .result-score{
    font-family:'Playfair Display',serif; font-size:52px; font-weight:900; text-align:center;
    background:linear-gradient(180deg,#fff,#f0c94a); -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:8px 0 2px;
  }
  .result-sub{ text-align:center; color:var(--grey); font-size:14px; margin-bottom:24px; }

  .leaderboard{ margin-top:6px; }
  .lb-title{ font-family:'Playfair Display',serif; font-size:12px; letter-spacing:0.06em; color:var(--gold-bright); text-transform:uppercase; margin-bottom:12px; }
  .lb-row{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px;
    background:rgba(255,255,255,0.04); margin-bottom:6px; font-size:14px;
  }
  .lb-rank{ font-family:'Playfair Display',serif; font-weight:700; width:22px; color:var(--gold-bright); }
  .lb-name{ flex:1; }
  .lb-score{ font-family:'Playfair Display',serif; font-weight:700; color:var(--gold-bright); }
  .lb-empty{ color:var(--grey); font-size:13px; }
  .loading{ text-align:center; color:var(--grey); font-size:13px; padding:20px 0; }

  .link-row{ text-align:center; margin-top:18px; }
  .link-btn{
    background:none; border:none; color:var(--grey); font-family:'Inter',sans-serif;
    font-size:12px; text-decoration:underline; cursor:pointer; letter-spacing:0.02em;
  }
  .link-btn:hover{ color:var(--gold-bright); }

  table.dash{ width:100%; border-collapse:collapse; font-size:13px; margin-top:14px; }
  table.dash th{
    text-align:left; font-family:'Playfair Display',serif; font-size:10px; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--gold-bright); padding:8px 6px; border-bottom:1px solid rgba(240,201,74,0.3);
  }
  table.dash td{ padding:9px 6px; border-bottom:1px solid rgba(255,255,255,0.07); }
  table.dash tr:last-child td{ border-bottom:none; }
  .dash-rank{ color:var(--gold-bright); font-family:'Playfair Display',serif; font-weight:700; }
  .dash-empty{ color:var(--grey); font-size:13px; text-align:center; padding:24px 0; }
  .toolbar{ display:flex; gap:10px; margin-top:20px; }
  .toolbar .btn{ margin-top:0; }
  .btn.danger{
    background:transparent; border:1px solid rgba(255,92,108,0.45); color:var(--bad); box-shadow:none;
  }
  .btn.danger.confirming{ background:rgba(255,92,108,0.15); border-color:var(--bad); }
  .stat-row{ display:flex; gap:10px; margin-top:14px; margin-bottom:4px; }
  .stat-box{
    flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
    border-radius:10px; padding:12px; text-align:center;
  }
  .stat-box .num{ font-family:'Playfair Display',serif; font-weight:800; font-size:20px; color:var(--gold-bright); }
  .stat-box .lbl{ font-size:11px; color:var(--grey); margin-top:2px; text-transform:uppercase; letter-spacing:0.04em; }
</style>
</head>

let state = { name:"", idx:0, score:0, answered:false, secondsLeft:TOTAL_SECONDS, startedAt:0 };
let timerInterval = null;
const card = document.getElementById('card');

function letter(i){ return String.fromCharCode(65+i); }
function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  el.textContent = '⏱ ' + fmtTime(state.secondsLeft);
  el.classList.toggle('warn', state.secondsLeft <= 30);
}

function startTimer(){
  stopTimer();
  state.secondsLeft = TOTAL_SECONDS;
  state.startedAt = Date.now();
  timerInterval = setInterval(()=>{
    state.secondsLeft--;
    updateTimerDisplay();
    if(state.secondsLeft <= 0){ stopTimer(); timeUp(); }
  }, 1000);
}

function timeUp(){
  if(state.idx >= QUESTIONS.length) return;
  const fb = document.getElementById('feedbackZone');
  document.querySelectorAll('.option').forEach(el=> el.disabled = true);
  if(fb){ fb.innerHTML = `<div class="feedback bad"><b>Time's up!</b>The 5-minute timer ran out. Submitting your quiz now.</div>`; }
  setTimeout(finish, 900);
}

function renderStart(){
  stopTimer();
  card.innerHTML = `
    <h1>Freelancing Live Quiz</h1>
    <p class="sub">FRL101 · Quiz 1–3 recap · ${QUESTIONS.length} questions · 5 minutes total</p>
    <label for="nameInput">Enter your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Ayesha Khan" maxlength="40" autocomplete="off">
    <button class="btn" id="startBtn" disabled>Start Quiz</button>
    <div class="link-row"><button class="link-btn" id="teacherLink">Teacher Dashboard →</button></div>
  `;
  const nameInput = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  nameInput.addEventListener('input', ()=>{ startBtn.disabled = nameInput.value.trim().length === 0; });
  nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !startBtn.disabled) startBtn.click(); });
  startBtn.addEventListener('click', ()=>{
    state.name = nameInput.value.trim();
    state.idx = 0; state.score = 0;
    startTimer();
    renderQuestion();
  });
  document.getElementById('teacherLink').addEventListener('click', renderDashboard);
  setTimeout(()=>nameInput.focus(), 50);
}

function renderQuestion(){
  state.answered = false;
  const q = QUESTIONS[state.idx];
  const pct = Math.round((state.idx/QUESTIONS.length)*100);
  card.innerHTML = `
    <div class="progress-row">
      <span class="progress-label">Q ${state.idx+1} / ${QUESTIONS.length}</span>
      <span class="timer" id="timerDisplay">⏱ ${fmtTime(state.secondsLeft)}</span>
      <span class="score-pill">Score: ${state.score}</span>
    </div>
    <div class="track"><div class="track-fill" style="width:${pct}%"></div></div>
    <p class="q-text">${q.q}</p>
    <div id="opts"></div>
    <div id="feedbackZone"></div>
  `;
  updateTimerDisplay();
  const opts = document.getElementById('opts');
  q.opts.forEach((text, i)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.innerHTML = `<span class="option-letter">${letter(i)}</span><span>${text}</span>`;
    b.addEventListener('click', ()=> selectOption(i));
    opts.appendChild(b);
  });
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  const q = QUESTIONS[state.idx];
  const correct = i === q.correct;
  if(correct) state.score++;

  document.querySelectorAll('.option').forEach((el, idx)=>{
    el.disabled = true;
    if(idx === q.correct) el.classList.add('correct');
    else if(idx === i) el.classList.add('wrong');
  });

  const fb = document.getElementById('feedbackZone');
  fb.innerHTML = `
    <div class="feedback ${correct?'good':'bad'}">
      <b>${correct ? "Correct!" : "Not quite"}</b>${q.msg}
    </div>
    <button class="btn" id="nextBtn">${state.idx === QUESTIONS.length-1 ? 'See Results' : 'Next Question'}</button>
  `;
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    state.idx++;
    if(state.idx >= QUESTIONS.length) finish();
    else renderQuestion();
  });
}

async function finish(){
  stopTimer();
  const timeTakenSec = Math.min(TOTAL_SECONDS, Math.round((Date.now() - state.startedAt)/1000));
  card.innerHTML = `
    <div class="progress-row"><span class="progress-label">Complete</span><span class="score-pill">Score: ${state.score}/${QUESTIONS.length}</span></div>
    <div class="result-score">${state.score}/${QUESTIONS.length}</div>
    <p class="result-sub">Nice work, ${escapeHtml(state.name)} 👏 · finished in ${fmtTime(timeTakenSec)}</p>
    <div class="leaderboard">
      <div class="lb-title">Live Class Leaderboard</div>
      <div id="lbBody" class="loading">Loading leaderboard…</div>
    </div>
    <button class="btn ghost" id="retryBtn">Take Again</button>
  `;
  document.getElementById('retryBtn').addEventListener('click', renderStart);

  try{
    await window.storage.set('score:' + state.name + ':' + Date.now(), JSON.stringify({
      name:state.name, score:state.score, total:QUESTIONS.length, ts:Date.now(), timeTaken:timeTakenSec
    }), true);
  }catch(e){ console.error('save failed', e); }

  await loadLeaderboard();
}

async function fetchAllScores(){
  const list = await window.storage.list('score:', true);
  if(!list || !list.keys || list.keys.length===0) return [];
  const entries = [];
  for(const k of list.keys){
    try{
      const r = await window.storage.get(k, true);
      if(r && r.value) entries.push(JSON.parse(r.value));
    }catch(e){}
  }
  entries.sort((a,b)=> b.score - a.score || (a.timeTaken||0) - (b.timeTaken||0) || a.ts - b.ts);
  return entries;
}

async function loadLeaderboard(){
  const body = document.getElementById('lbBody');
  try{
    const entries = await fetchAllScores();
    if(entries.length===0){ body.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>'; return; }
    const top = entries.slice(0,10);
    body.innerHTML = top.map((e,i)=>`
      <div class="lb-row">
        <span class="lb-rank">#${i+1}</span>
        <span class="lb-name">${escapeHtml(e.name)}</span>
        <span class="lb-score">${e.score}/${e.total}</span>
      </div>
    `).join('');
  }catch(e){ body.innerHTML = '<div class="lb-empty">Leaderboard unavailable right now.</div>'; }
}

async function renderDashboard(){
  stopTimer();
  card.innerHTML = `
    <h1>Teacher Dashboard</h1>
    <p class="sub">Every student's result for this quiz session</p>
    <div id="dashStats"></div>
    <div id="dashBody" class="loading">Loading results…</div>
    <div class="toolbar">
      <button class="btn ghost" id="refreshBtn">Refresh</button>
      <button class="btn danger" id="clearBtn">Clear All Scores</button>
    </div>
    <div class="link-row"><button class="link-btn" id="backLink">← Back to Quiz</button></div>
  `;
  document.getElementById('backLink').addEventListener('click', renderStart);
  document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

  const clearBtn = document.getElementById('clearBtn');
  let confirming = false;
  clearBtn.addEventListener('click', async ()=>{
    if(!confirming){
      confirming = true;
      clearBtn.textContent = 'Click again to confirm';
      clearBtn.classList.add('confirming');
      setTimeout(()=>{
        if(confirming){ confirming = false; clearBtn.textContent = 'Clear All Scores'; clearBtn.classList.remove('confirming'); }
      }, 4000);
      return;
    }
    confirming = false;
    clearBtn.textContent = 'Clearing…';
    clearBtn.disabled = true;
    try{
      const list = await window.storage.list('score:', true);
      if(list && list.keys){ for(const k of list.keys){ try{ await window.storage.delete(k, true); }catch(e){} } }
    }catch(e){ console.error('clear failed', e); }
    clearBtn.disabled = false;
    clearBtn.textContent = 'Clear All Scores';
    clearBtn.classList.remove('confirming');
    await loadDashboard();
  });

  await loadDashboard();
}

async function loadDashboard(){
  const body = document.getElementById('dashBody');
  const statsEl = document.getElementById('dashStats');
  body.innerHTML = '<div class="loading">Loading results…</div>';
  try{
    const entries = await fetchAllScores();
    if(entries.length===0){
      statsEl.innerHTML = '';
      body.innerHTML = '<div class="dash-empty">No students have taken the quiz yet.</div>';
      return;
    }
    const avg = (entries.reduce((s,e)=>s+e.score,0) / entries.length).toFixed(1);
    const top = entries[0];
    statsEl.innerHTML = `
      <div class="stat-row">
        <div class="stat-box"><div class="num">${entries.length}</div><div class="lbl">Attempts</div></div>
        <div class="stat-box"><div class="num">${avg}</div><div class="lbl">Avg Score</div></div>
        <div class="stat-box"><div class="num">${top.score}/${top.total}</div><div class="lbl">Top Score</div></div>
      </div>
    `;
    body.innerHTML = `
      <table class="dash">
        <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Time</th></tr></thead>
        <tbody>
          ${entries.map((e,i)=>`
            <tr>
              <td class="dash-rank">${i+1}</td>
              <td>${escapeHtml(e.name)}</td>
              <td>${e.score}/${e.total}</td>
              <td>${e.timeTaken!=null ? fmtTime(e.timeTaken) : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }catch(e){ body.innerHTML = '<div class="dash-empty">Could not load results right now.</div>'; }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

renderStart();
</script>
